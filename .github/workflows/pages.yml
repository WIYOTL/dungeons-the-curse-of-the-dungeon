name: Deploy static game to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Verify game
        run: |
          npm test
          npm run build
      - name: Prepare Pages artifact
        run: |
          mkdir -p dist/js dist/icons
          cp index.html privacy.html manifest.webmanifest service-worker.js wiyotl_logo.webp .nojekyll dist/
          cp js/*.js dist/js/
          cp icons/dungeon-192.png icons/dungeon-512.png icons/dungeon-logo-d.png dist/icons/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
